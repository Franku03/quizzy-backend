version: '3.8'

services:
  quizzy-backend:
    build: 
      context: .
      dockerfile: Dockerfile.prod
    container_name: quizzy_server
    restart: always
    ports:
      - "3000:3000"
      - "3003:3003"
    env_file:
      - .env
    logging:
      driver: "json-file"
      options:
        max-size: "10k"
        max-file: "1"
    deploy:
      resources:
        limits:
          cpus: '8.0'    
          memory: 24G